<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Library Management Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Library Management System</h1>
  </header>

  <nav>
    <button onclick="showSection('dashboard')">
      Dashboard
    </button>

    <button onclick="showSection('books')">
      Books
    </button>

    <button onclick="showSection('members')">
      Members
    </button>
  </nav>

  <main>
    <section id="dashboard">
      <h2>Library Dashboard</h2>
      <p>Welcome to the Library Management Interface.</p>
    </section>

    <section id="books" hidden>
      <h2>Book Catalogue</h2>
      <input id="search" placeholder="Search books">
      <ul id="book-list">
        <li>Web Development</li>
        <li>Computer Programming</li>
        <li>Database Management</li>
      </ul>
    </section>

    <section id="members" hidden>
      <h2>Library Members</h2>
      <p>Member information is displayed here.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
